<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Vuelta del Coyote MTB</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap');
:root{
    --sky-top:#050810;
    --sky-horizon:#1c4a82;
    --sky-glow:#2f7fc9;
    --mountain-far:#101d33;
    --mountain-mid:#0c1626;
    --mountain-near:#070d18;
    --sand:#5b83b3;
    --cream:#dce9f9;
    --amber:#4db2f0;
    --dust:#9fc2e8;
    --line:rgba(220,233,249,0.16);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'JetBrains Mono', monospace;
    background:var(--sky-top);
}

/* ===== ESCENARIO ===== */

.loader{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
    background:
        radial-gradient(ellipse 60% 40% at 50% 62%, var(--sky-glow) 0%, rgba(47,127,201,0) 70%),
        linear-gradient(180deg, var(--sky-top) 0%, #0e1f38 55%, var(--sky-horizon) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--cream);
}

/* estrellas */
.stars{
    position:absolute;
    inset:0;
    width:100%;
    height:60%;
}
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--cream);
    border-radius:50%;
    opacity:.5;
    animation:parpadeo 3s ease-in-out infinite;
}
@keyframes parpadeo{
    0%,100%{opacity:.15;}
    50%{opacity:.75;}
}

/* luna */
.luna{
    position:absolute;
    top:10%;
    right:14%;
    width:54px;
    height:54px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #f3f9ff, var(--amber) 70%);
    box-shadow:0 0 40px 6px rgba(77,178,240,0.4);
}

/* siluetas de montaña, capas para profundidad */
.montanas{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    line-height:0;
}
.montanas svg{display:block;width:100%;height:auto;}
.capa-lejos{opacity:1;transform:translateY(2%);}
.capa-cerca{opacity:1;}

/* ===== CONTENIDO ===== */

.contenido{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 24px;
    width:100%;
    max-width:560px;
}

.marca{
    font-family:"Zen Dots", sans-serif;
    font-size:44px;
    letter-spacing:6px;
    line-height:1;
    text-align:center;
    color:var(--cream);
}
.marca span{
    display:block;
    font-size:22px;
    letter-spacing:9px;
    color:var(--amber);
    margin-top:4px;
}

.subtitulo{
    margin-top:14px;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--dust);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:8px 0;
}

/* ===== SENDERO / BARRA DE PROGRESO ===== */

.sendero-wrap{
    width:100%;
    margin-top:34px;
}
.sendero-svg{
    width:100%;
    height:auto;
    overflow:visible;
}
.trazo-fondo{
    fill:none;
    stroke:rgba(220,233,249,0.18);
    stroke-width:3;
    stroke-dasharray:2 10;
    stroke-linecap:round;
}
.trazo-progreso{
    fill:none;
    stroke:var(--amber);
    stroke-width:3;
    stroke-linecap:round;
    filter:drop-shadow(0 0 5px rgba(232,163,61,0.7));
}
.ciclista{
    transform-box:fill-box;
    transform-origin:center;
}
.ciclista circle{
    fill:none;
    stroke:var(--cream);
    stroke-width:2.4;
}
.ciclista line{
    stroke:var(--cream);
    stroke-width:2.4;
    stroke-linecap:round;
}
.polvo{
    fill:var(--dust);
    opacity:0;
}
@keyframes disipar{
    0%{opacity:.55;}
    100%{opacity:0;transform:translate(-14px,6px) scale(1.6);}
}

/* ===== LECTURA / COMPUTADORA DE RUTA ===== */

.lectura{
    margin-top:26px;
    display:flex;
    align-items:baseline;
    gap:4px;
}
.porcentaje{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:64px;
    color:var(--cream);
    font-variant-numeric:tabular-nums;
    letter-spacing:1px;
}
.simbolo{
    font-size:24px;
    color:var(--amber);
    font-weight:700;
}

.etiqueta{
    font-size:10px;
    letter-spacing:5px;
    color:var(--dust);
    text-transform:uppercase;
    margin-top:2px;
}

.estado{
    margin-top:18px;
    min-height:16px;
    font-size:12px;
    letter-spacing:1.5px;
    color:var(--amber);
    text-transform:uppercase;
}

/* ===== TEXTO FINAL ===== */

.texto-final{
    display:none;
    margin-top:26px;
    color:var(--cream);
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    letter-spacing:3px;
    text-align:center;
}
.parpadear{
    animation:parpadearTexto 1s infinite;
}
@keyframes parpadearTexto{
    50%{opacity:.35;}
}

/* ===== RESPONSIVE ===== */

@media(max-width:600px){
    .marca{font-size:34px;letter-spacing:4px;}
    .marca span{font-size:16px;letter-spacing:6px;}
    .porcentaje{font-size:48px;}
    .luna{width:36px;height:36px;top:8%;right:10%;}
    .contenido{max-width:100%;}
}

@media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
}
</style>
</head>

<body>

<div class="loader">

    <div class="stars" id="stars"></div>
    <div class="luna"></div>

    <div class="montanas">
        <svg class="capa-lejos" viewBox="0 0 1000 160" preserveAspectRatio="none">
            <path fill="var(--mountain-far)" d="M0,160 L0,90 L120,40 L230,100 L340,30 L460,95 L580,20 L700,90 L820,50 L920,110 L1000,70 L1000,160 Z"></path>
        </svg>
        <svg class="capa-cerca" viewBox="0 0 1000 120" preserveAspectRatio="none" style="margin-top:-6%;">
            <path fill="var(--mountain-near)" d="M0,120 L0,70 L100,110 L200,50 L320,100 L430,60 L560,110 L660,55 L780,100 L880,65 L1000,100 L1000,120 Z"></path>
        </svg>
    </div>

    <div class="contenido">
        <h1 class="marca">
            LA VUELTA
            <span>DEL COYOTE</span>
        </h1>

        <div class="subtitulo">Ruta de montaña · MTB</div>

        <div class="sendero-wrap">
            <svg class="sendero-svg" viewBox="0 0 800 120" preserveAspectRatio="none">
                <path class="trazo-fondo" d="M 5 95 C 90 45, 130 140, 210 80 S 330 10, 390 80 S 510 150, 570 60 S 690 5, 750 75" />
                <path class="trazo-progreso" id="trazoProgreso" d="M 5 95 C 90 45, 130 140, 210 80 S 330 10, 390 80 S 510 150, 570 60 S 690 5, 750 75" />
                <g class="ciclista" id="ciclista">
                    <circle cx="-6" cy="4" r="5"></circle>
                    <circle cx="8" cy="4" r="5"></circle>
                    <line x1="-6" y1="4" x2="2" y2="-6"></line>
                    <line x1="2" y1="-6" x2="8" y2="4"></line>
                    <line x1="2" y1="-6" x2="-1" y2="-10"></line>
                </g>
                <g id="capaPolvo"></g>
            </svg>
        </div>

        <div class="lectura">
            <span class="porcentaje" id="porcentaje">04</span><span class="simbolo">%</span>
        </div>
        <div class="etiqueta">Completado</div>

        <div class="estado" id="estado">Afilando la cadena…</div>

        <p class="texto-final" id="textoFinal">
            Bienvenido a La Vuelta del Coyote MTB
        </p>

    </div>

</div>

<script>

/* estrellas aleatorias */
(function crearEstrellas(){
    var contenedor = document.getElementById('stars');
    for(var i=0;i<40;i++){
        var s = document.createElement('div');
        s.className='star';
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*55+'%';
        s.style.animationDelay = (Math.random()*3)+'s';
        contenedor.appendChild(s);
    }
})();

var path = document.getElementById('trazoProgreso');
var largoTotal = path.getTotalLength();
path.style.strokeDasharray = largoTotal;
path.style.strokeDashoffset = largoTotal;

var rider = document.getElementById('ciclista');
var porcentajeEl = document.getElementById('porcentaje');
var estadoEl = document.getElementById('estado');
var textoFinal = document.getElementById('textoFinal');
var capaPolvo = document.getElementById('capaPolvo');

var estados = [
    {hasta:20, texto:'Afilando la cadena…'},
    {hasta:40, texto:'Calculando el desnivel…'},
    {hasta:60, texto:'Despertando al coyote…'},
    {hasta:80, texto:'Marcando el sendero…'},
    {hasta:99, texto:'Últimos metros de subida…'}
];

function actualizarEstado(count){
    for(var i=0;i<estados.length;i++){
        if(count<=estados[i].hasta){
            estadoEl.textContent = estados[i].texto;
            return;
        }
    }
}

function moverCiclista(fraccion){
    var punto = path.getPointAtLength(fraccion*largoTotal);
    var puntoSiguiente = path.getPointAtLength(Math.min(fraccion*largoTotal+2, largoTotal));
    var angulo = Math.atan2(puntoSiguiente.y-punto.y, puntoSiguiente.x-punto.x) * 180/Math.PI;
    rider.setAttribute('transform','translate('+punto.x+','+punto.y+') rotate('+angulo+')');
    return punto;
}

function crearPolvo(punto){
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    var r = 1.5 + Math.random()*1.5;
    c.setAttribute('cx', punto.x-6);
    c.setAttribute('cy', punto.y+6);
    c.setAttribute('r', r);
    c.setAttribute('class','polvo');
    c.style.animation = 'disipar '+(0.6+Math.random()*0.4)+'s ease-out forwards';
    capaPolvo.appendChild(c);
    setTimeout(function(){ c.remove(); }, 1100);
}

function progress(){

    var count = 4;
    moverCiclista(count/100);

    var loading = setInterval(animate, 90);

    function animate(){

        if(count >= 100){

            porcentajeEl.classList.add('parpadear');
            textoFinal.style.display = 'block';
            textoFinal.classList.add('parpadear');
            estadoEl.style.display = 'none';
            clearInterval(loading);

        } else {

            count++;
            var fraccion = count/100;

            porcentajeEl.textContent = (count<10?'0':'')+count;
            path.style.strokeDashoffset = largoTotal * (1-fraccion);

            var punto = moverCiclista(fraccion);
            if(count % 4 === 0){ crearPolvo(punto); }

            actualizarEstado(count);
        }
    }
}

progress();

setTimeout(function(){
    window.location.href = "home.html";
}, 9000);

</script>

</body>
</html>
